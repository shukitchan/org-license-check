# Monthly organization-wide dependency license check.
#
# Requires a GitHub App with read access to the dependency graph, installed on
# the org. Secrets: APP_ID, APP_PRIVATE_KEY. Set the ORG_NAME variable, or it
# defaults to the repository owner.
#
# To file Jira tickets automatically, set the repository variable CREATE_JIRA
# to 'true' and add the JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN secrets.

name: Monthly org dependency license check

on:
  schedule:
    # 06:00 UTC on the 1st of each month
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      org_name:
        description: 'Organization name (default: repo owner)'
        required: false
        type: string
      fail_on:
        description: 'Tier that fails the run'
        required: false
        default: 'red'
        type: choice
        options: [green, yellow, red, red-cloned, never]
      create_jira:
        description: 'Actually create Jira tickets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve organization
        id: org
        run: |
          ORG="${{ inputs.org_name || vars.ORG_NAME || github.repository_owner }}"
          echo "org=${ORG}" >> "$GITHUB_OUTPUT"
          echo "Using organization: ${ORG}"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.org.outputs.org }}

      # Carries state/ between runs so the report can show what is new this
      # month and so Jira tickets are not re-filed. Keyed by run number with a
      # prefix fallback to the most recent previous run.
      - name: Restore previous run state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: license-check-state-${{ github.run_number }}
          restore-keys: license-check-state-

      - name: Run license check
        id: check
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          JIRA_FLAG=""
          if [ "${{ inputs.create_jira || vars.CREATE_JIRA }}" = "true" ]; then
            JIRA_FLAG="--jira"
          fi
          set +e
          ./run-monthly.sh \
            --org "${{ steps.org.outputs.org }}" \
            --fail-on "${{ inputs.fail_on || 'red' }}" \
            $JIRA_FLAG
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Job summary
        if: always()
        run: |
          if [ -f output/LICENSE_REPORT.md ]; then
            head -c 900000 output/LICENSE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The license check produced no report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ github.run_number }}
          path: |
            output/report.json
            output/findings.json
            output/LICENSE_REPORT.md
            output/jira-tickets.json
          if-no-files-found: warn

      - name: Save run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: license-check-state-${{ github.run_number }}

      - name: Fail on policy violations
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "License check exited ${{ steps.check.outputs.exit_code }}" >&2
          exit 1
